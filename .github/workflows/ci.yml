name: Clarity Clinical CI

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: clarity-clinical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ClarityClinical.Ui/package-lock.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore ClarityClinical.slnx

      - name: Verify public-demo packaging contract
        shell: pwsh
        run: ./tests/Deployment/verify-packaging.ps1

      - name: Verify release readiness contract
        shell: pwsh
        run: ./tests/Release/verify-release-readiness.ps1

      - name: Run .NET tests
        run: dotnet test ClarityClinical.slnx --no-restore

      - name: Verify EF model is fully migrated
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/ClarityClinical.Infrastructure
          --startup-project src/ClarityClinical.Api

      - name: Install Angular dependencies
        working-directory: src/ClarityClinical.Ui
        run: npm ci

      - name: Run Angular tests
        working-directory: src/ClarityClinical.Ui
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Angular application
        working-directory: src/ClarityClinical.Ui
        run: npm run build

      - name: Audit runtime npm dependencies
        working-directory: src/ClarityClinical.Ui
        run: npm audit --omit=dev

      - name: Check whitespace
        run: git diff --check HEAD^
