name: Clarity Clinical RC Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable RC tag, for example v0.1.0-rc.1
        required: true
        type: string
      git_sha:
        description: Exact 40-character commit SHA from develop
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ '${{ inputs.release_tag }}' =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ '${{ inputs.git_sha }}' =~ ^[0-9a-fA-F]{40}$ ]]

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0

      - name: Verify commit belongs to develop and tag is fresh
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin develop --tags
          git merge-base --is-ancestor '${{ inputs.git_sha }}' origin/develop
          ! git show-ref --verify --quiet 'refs/tags/${{ inputs.release_tag }}'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ClarityClinical.Ui/package-lock.json

      - name: Build canonical immutable release
        shell: bash
        run: |
          bash scripts/ci/Build-ClarityClinical-Release.sh \
            --repository-root "$GITHUB_WORKSPACE" \
            --commit '${{ inputs.git_sha }}' \
            --release-tag '${{ inputs.release_tag }}' \
            --output-root "$RUNNER_TEMP/clarityclinical-release"

      - name: Create annotated RC tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Ask For Dowding Release Bot'
          git config user.email 'releases@askfordowding.co.uk'
          git tag -a '${{ inputs.release_tag }}' '${{ inputs.git_sha }}' -m "Clarity Clinical ${{ inputs.release_tag }}"
          git push origin 'refs/tags/${{ inputs.release_tag }}'

      - name: Publish GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create '${{ inputs.release_tag }}' \
            "$RUNNER_TEMP/clarityclinical-release/clarityclinical-release.tar.gz" \
            "$RUNNER_TEMP/clarityclinical-release/clarityclinical-release.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Clarity Clinical ${{ inputs.release_tag }}" \
            --notes "Immutable release candidate for Henry TEST and Stella STAGING promotion."
